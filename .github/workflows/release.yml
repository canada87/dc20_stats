name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'module.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read version from module.json
        id: vars
        run: |
          VERSION=$(jq -r '.version' module.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.vars.outputs.tag }}" | grep -q .; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update download URL in module.json
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          jq \
            --arg download "https://github.com/canada87/dc20_stats/releases/download/${{ steps.vars.outputs.tag }}/dc20_stats.zip" \
            '.download = $download' \
            module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Commit, tag and push
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json
          git diff --staged --quiet || git commit -m "chore: release ${{ steps.vars.outputs.tag }} [skip ci]"
          git push origin main
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Build zip
        if: steps.tag_check.outputs.exists == 'false'
        run: zip -r dc20_stats.zip module.json scripts/ templates/ styles/

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "v${{ steps.vars.outputs.version }}"
          files: dc20_stats.zip
          generate_release_notes: true
